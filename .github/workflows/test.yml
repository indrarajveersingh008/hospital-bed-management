name: CI Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: hospital_bed_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Alembic schema migrations
      env:
        DATABASE_URL: mysql+pymysql://root:password@127.0.0.1:3306/hospital_bed_system
        JWT_SECRET_KEY: ci_test_jwt_secret_key_1234567890_ci_test
        MFA_ENCRYPTION_KEY: ci_test_mfa_encryption_key_1234567890_ci_test
      run: |
        cd backend
        alembic upgrade head

    - name: Run Backend Integration & Security Tests
      env:
        DATABASE_URL: mysql+pymysql://root:password@127.0.0.1:3306/hospital_bed_system
        JWT_SECRET_KEY: ci_test_jwt_secret_key_1234567890_ci_test
        MFA_ENCRYPTION_KEY: ci_test_mfa_encryption_key_1234567890_ci_test
      run: |
        cd backend
        python test_auth.py
        python test_hospitals.py
        python test_mfa.py
        python test_tokens.py
        python test_security_hardening.py
        python test_documents.py

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm install

    - name: Build frontend application
      run: |
        cd frontend
        npm run build
